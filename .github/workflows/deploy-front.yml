name: Deploy Frontend a Droplet

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Descargar el código
        uses: actions/checkout@v3

      - name: 2. Configurar la llave SSH
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: 'just-a-placeholder'

      - name: 3. Añadir el servidor a la lista de confianza
        run: ssh-keyscan -H ${{ secrets.HOST }} >> ~/.ssh/known_hosts

      - name: 4. Instalar dependencias y compilar frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: 5. Crear carpeta en el servidor
        run: ssh ${{ secrets.USERNAME }}@${{ secrets.HOST }} "mkdir -p /var/www/tenis-manager"

      - name: 6. Subir archivos al servidor
        run: rsync -avz --delete frontend/out/ ${{ secrets.USERNAME }}@${{ secrets.HOST }}:/var/www/tenis-manager/
