server {
    server_name riversideclases.portaltorneos-riocuarto.com.ar;

    root /var/www/tenis-manager;
    index index.html index.htm;

    location / {
       try_files $uri $uri.html $uri/ /index.html;
    }

    location /api/ {
        proxy_pass https://tenis-manager.onrender.com;
        proxy_ssl_server_name on;
        proxy_set_header Host tenis-manager.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/riversideclases.portaltorneos-riocuarto.com.ar/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/riversideclases.portaltorneos-riocuarto.com.ar/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = riversideclases.portaltorneos-riocuarto.com.ar) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name riversideclases.portaltorneos-riocuarto.com.ar;
    return 404; # managed by Certbot


}
